name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # g++-14 (--std=c++26) + FLTK для GUI-части проекта
      - name: Install g++-14 and FLTK
        run: sudo apt-get update && sudo apt-get install -y g++-14 libfltk1.3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build --parallel

      # Приложение GUI: запускается только локально (в CI нет дисплея)
